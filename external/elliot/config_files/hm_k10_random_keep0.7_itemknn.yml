experiment:
  dataset: hm_k10_random_keep0.7

  data_config:
    strategy: fixed
    train_path: ../../../data/processed/hm_k10_random_keep0.7/train.tsv
    test_path: ../../../data/processed/hm_k10_random_keep0.7/test.tsv

  top_k: 50

  evaluation:
    cutoffs: [10, 20]
    simple_metrics: [Precision, Recall, nDCG, MAP, MRR, Precision_u1, Recall_u1, nDCG_u1, MAP_u1, MRR_u1]

  path_output_rec_result: ../../../results/elliot/recs/
  path_output_rec_performance: ../../../results/elliot/performance/
  path_log_folder: ../../../results/elliot/logs/

  gpu: -1

  models:
    ItemKNN:
      meta:
        save_recs: True
      neighbors: 40
      similarity: cosine
