experiment:
  dataset: hm_dedup_base_split

  data_config:
    strategy: fixed
    train_path: ../../../data/processed/hm_dedup_base_split/train.tsv
    validation_path: ../../../data/processed/hm_dedup_base_split/valid.tsv
    test_path: ../../../data/processed/hm_dedup_base_split/test.tsv

  top_k: 50

  evaluation:
    cutoffs: [10, 20, 50]
    simple_metrics: [Precision, Recall, nDCG, MAP, MRR, Precision_u1, Recall_u1, nDCG_u1, MAP_u1, MRR_u1]

  path_output_rec_result: ../../results/elliot/hm_dedup_base_split/recs/
  path_output_rec_performance: ../../results/elliot/hm_dedup_base_split/performance/
  path_log_folder: ../../results/elliot/hm_dedup_base_split/logs/

  gpu: -1

  models:
    FunkSVD:
      meta:
        save_recs: False
        validation_metric: nDCG@20
        validation_rate: 5
      epochs: 6
      batch_size: 512
      factors: 64
      lr: 0.001
      reg_w: 0.1
      reg_b: 0.001
      early_stopping:
        monitor: nDCG@20
        mode: max
        patience: 5
        min_delta: 0.0001
        verbose: True
