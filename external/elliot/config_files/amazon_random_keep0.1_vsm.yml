experiment:
  dataset: amazon_random_keep0.1

  data_config:
    strategy: fixed
    train_path: ../../../data/processed/amazon_random_keep0.1/train.tsv
    test_path: ../../../data/processed/amazon_random_keep0.1/test.tsv
    side_information:
    - dataloader: ItemAttributes
      attribute_file: ../../../data/processed/amazon_item_attributes.tsv

  top_k: 50

  evaluation:
    cutoffs: [10, 20, 50]
    simple_metrics: [Precision, Recall, nDCG, MAP, MRR, Precision_u1, Recall_u1, nDCG_u1, MAP_u1, MRR_u1]

  path_output_rec_result: ../../results/elliot/amazon_random_keep0.1/recs/
  path_output_rec_performance: ../../results/elliot/amazon_random_keep0.1/performance/
  path_log_folder: ../../results/elliot/amazon_random_keep0.1/logs/

  gpu: -1

  models:
    VSM:
      meta:
        save_recs: True
      similarity: cosine
