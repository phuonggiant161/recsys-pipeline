experiment:
  dataset: amazon_dedup_base_split

  data_config:
    strategy: fixed
    train_path: ../../../data/processed/amazon_dedup_base_split/train.tsv
    test_path: ../../../data/processed/amazon_dedup_base_split/test.tsv

  top_k: 50

  evaluation:
    cutoffs: [10, 20, 50]
    simple_metrics: [Precision, Recall, nDCG, MAP, MRR, Precision_u1, Recall_u1, nDCG_u1, MAP_u1, MRR_u1]

  path_output_rec_result: ../../results/elliot/amazon_dedup_base_split/recs/
  path_output_rec_performance: ../../results/elliot/amazon_dedup_base_split/performance/
  path_log_folder: ../../results/elliot/amazon_dedup_base_split/logs/

  gpu: -1

  models:
    ItemKNN:
      meta:
        save_recs: True
      neighbors: 40
      similarity: cosine
