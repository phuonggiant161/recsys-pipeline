experiment:
  dataset: hm_random_keep0.1

  data_config:
    strategy: fixed
    train_path: data/processed/hm_random_keep0.1/train.tsv
    valid_path: data/processed/hm_random_keep0.1/valid.tsv
    test_path: data/processed/hm_random_keep0.1/test.tsv

  top_k: 50

  evaluation:
    cutoffs: [30]
    simple_metrics: [SEntropy, Gini, Recall_tail, nDCG_tail, Recall, nDCG]
    long_tail_threshold: 15

  # path_output_rec_result: ../../results/elliot/hm_random_keep0.1/recs/
  path_output_rec_performance: results/elliot/hm_random_keep0.1/performance/
  path_log_folder: results/elliot/hm_random_keep0.1/logs/

  gpu: 0

  models:
    ProxyRecommender:
      path: results/elliot/hm_random_keep0.1/recs/FunkSVD_seed=42_e=100_bs=512_factors=64_lr=0$0001_reg_w=0$1_reg_b=0$001_it=27.tsv
    # 2. Use RecommendationFolder to load the precomputed file
    # RecommendationFolder:
    #   meta:
    #     verbose: True
    #     save_recs: False # No need to save them again
    #     validation_rate: 1
    #   # 3. Path to the folder containing your FunkSVD .tsv file
    #   folder: ../../results/elliot/hm_random_keep0.1/recs/FunkSVD_seed=42_e=50_bs=64_factors=512_lr=0$001_reg_w=0$1_reg_b=0$001_it=49.tsv

