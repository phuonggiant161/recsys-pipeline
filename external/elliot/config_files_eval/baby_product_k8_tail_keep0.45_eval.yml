experiment:
  dataset: baby_product_k8_tail_keep0.45

  data_config:
    strategy: fixed
    train_path: ../../../data/processed/baby_product_k8_tail_keep0.45/train.tsv
    test_path: ../../../data/processed/baby_product_k8_tail_keep0.45/test.tsv

  top_k: 50

  evaluation:
    cutoffs: [10, 20, 50]
    simple_metrics: [Precision, Recall, nDCG, MAP, MRR, Precision_u1, Recall_u1, nDCG_u1, MAP_u1, MRR_u1]

  path_output_rec_result: ../../results/elliot/baby_product_k8_tail_keep0.45/recs/
  path_output_rec_performance: ../../results/elliot/baby_product_k8_tail_keep0.45/performance/
  path_log_folder: ../../results/elliot/baby_product_k8_tail_keep0.45/logs/

  gpu: -1

  models:
    RecommendationFolder:
      folder: ../../results/elliot/baby_product_k8_tail_keep0.45/recs/
