model: BPR

# --- Data ---
benchmark_filename:
  - train
  - valid
  - test

USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp

field_separator: "\t"

load_col:
  inter:
    - user_id
    - item_id
    - timestamp

user_inter_num_interval: "[0,inf)"
item_inter_num_interval: "[0,inf)"

# --- Training ---
epochs: 300
train_batch_size: 2048
eval_batch_size: 4096

learner: adam
learning_rate: 0.001
weight_decay: 0

embedding_size: 256

train_neg_sample_args:
  distribution: uniform
  sample_num: 1
  alpha: 1.0
  dynamic: false
  candidate_num: 0

stopping_step: 10

# --- Evaluation ---
eval_args:
  group_by: user
  mode:
    valid: full
    test: full

metrics:
  - Precision
  - Recall
  - NDCG
  - MAP
  - MRR
  - U1Precision
  - U1Recall
  - U1NDCG
  - U1MAP
  - U1MRR

topk:
  - 10
  - 20
  - 50

valid_metric: NDCG@10
valid_metric_bigger: true
metric_decimal_place: 10

# --- Misc ---
seed: 2020
reproducibility: true
show_progress: true

use_gpu: true
gpu_id: 0

save_dataset: false
save_dataloaders: false
